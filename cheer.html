            document.getElementById('current-video').src = data.video;

            // 3. 更新歌詞 HTML
            document.getElementById('current-lyrics').innerHTML = data.lyrics;

            // 4. 更新按鈕選中樣式
            const buttons = document.querySelectorAll('.song-tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (element) {
                element.classList.add('active');
            }

            // 5. 滾動至練習區
            const container = document.querySelector('.song-container');
            if (container) {
                const topPos = container.getBoundingClientRect().top + window.pageYOffset - 80;
                window.scrollTo({ top: topPos, behavior: 'smooth' });
            }
        }

        // 初次進入頁面載入預設歌曲 (Mars)
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-video').src = songs.mars.video;
            document.getElementById('current-lyrics').innerHTML = songs.mars.lyrics;
        });
    </script>
</body>
</html>
